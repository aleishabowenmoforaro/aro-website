<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aro. — Cycle-Aware Wellbeing</title>

  <style>
    :root {
      --bg-start: #f6efe8;
      --bg-end: #f3f0e9;
      --white: #ffffff;
      --text-main: #3f3f3f;
      --text-muted: #6b6b6b;
      --accent: #c75b7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
    }

    /* ---------- HEADER / NAV ---------- */

    header {
      width: 100%;
      padding: 28px 48px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }

    .nav-logo {
      height: 128px;
    }

    .nav-center {
      display: flex;
      justify-content: center;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 14px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      opacity: 0.85;
    }

    .nav-cta {
      background: var(--accent);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---------- HERO ---------- */
