<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aro. — Cycle-Aware Wellbeing</title>

  <style>
    :root {
      --bg-start: #f6efe8;
      --bg-end: #f3f0e9;
      --text-main: #3f3f3f;
      --accent: #c75b7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
    }

    /* ---------- NAV ---------- */

    header {
      width: 100%;
      padding: 28px 48px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }

    /* Left swirl */
    .nav-logo {
      height: 128px;
      display: block;
    }

    /* Centre nav */
    .nav-center {
      display: flex;
      justify-content: center;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      opacity: 0.85;
    }

    /* Right CTA */
    .nav-cta {
      background: var(--accent);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---------- HERO ---------- */

    .hero {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-content {
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .hero-logo {
      height: 432px;
      display: block;
    }

    .hero-text {
      max-width: 640px;
      font-size: 20px;
      line-height: 1.5;
      opacity: 0.85;
    }

    .hero-cta {
      background: var(--accent);
      color: #fff;
      padding: 16px 32px;
      border-radius: 999px;
      font-size: 16px;
      text-decoration: none;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 768px) {
      header {
        padding: 20px 24px;
        grid-template-columns: auto auto;
      }

      .nav-center {
        display: none;
      }

      .nav-logo {
        height: 96px;
      }

      .hero {
        min-height: calc(100vh - 120px);
      }

      .hero-content {
        min-height: 85vh;
      }

      .hero-logo {
        height: 300px;
      }

      .hero-text {
        font-size: 18px;
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <header>
    <!-- Left: Swirl -->
    <img
      src="aroswirl.svg"
      alt="Aro swirl logo"
      class="nav-logo"
    />

    <!-- Centre: Tabs -->
    <div class="nav-center">
      <nav>
        <a href="#">Product</a>
        <a href="movement.html">Movement</a>
        <a href="#">Fuel</a>
        <a href="#">Rhythm</a>
        <a href="#">Subscriptions</a>
        <a href="#">Founder’s story</a>
      </nav>
    </div>

    <!-- Right: CTA -->
    <a href="#waitlist" class="nav-cta">Join waitlist</a>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">

      <img
        src="aro-logo.svg"
        alt="Aro logo"
        class="hero-logo"
      />

      <p class="hero-text">
        Finally understand your body. A cycle-aware wellbeing platform connecting movement, fuel, and rhythm.
      </p>
