<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aro. — Movement</title>

  <style>
    /* --- EXACT SAME DESIGN TOKENS AS index.html --- */
    :root {
      --bg-start: #f6efe8;
      --bg-end: #f3f0e9;
      --white: #ffffff;
      --text-main: #3f3f3f;
      --text-muted: #6b6b6b;
      --accent: #c75b7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
    }

    /* ---------- HEADER (UNCHANGED) ---------- */

    header {
      width: 100%;
      padding: 28px 48px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }

    .nav-logo {
      height: 128px;
    }

    .nav-center {
      display: flex;
      justify-content: center;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 14px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      opacity: 0.85;
    }

    .nav-cta {
      background: var(--accent);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---------- PAGE CONTENT ---------- */

    .page {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 24px;
    }

    .page-inner {
      max-width: 720px;
    }

    .page-inner h1 {
      font-size: 36px; /* matches section headers on homepage */
      margin-bottom: 24px;
    }

    .page-inner p {
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* ---------- RESPONSIVE (UNCHANGED PATTERN) ---------- */

    @media (max-width: 768px) {
      header {
        padding: 20px 24px;
        grid-template-columns: auto auto;
      }

      .nav-center {
        display: none;
      }

      .nav-logo {
        height: 96px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER (IDENTICAL TO index.html) -->
  <header>
    <img src="aroswirl.svg" alt="Aro swirl" class="nav-logo" />

    <div class="nav-center">
      <nav>
        <a href="index.html">Product</a>
        <a href="movement.html">Movement</a>
        <a href="fuel.html">Fuel</a>
        <a href="rhythm.html">Rhythm</a>
        <a href="#">Subscriptions</a>
        <a href="#">Founder’s story</a>
      </nav>
    </div>

    <a href="index.html#waitlist" class="nav-cta">Join waitlist</a>
  </header>

  <!-- CONTENT -->
  <section class="page">
    <div class="page-inner">
      <h1>Movement</h1>
      <p>
        Log workouts, runs, recovery, and training sessions — with guidance that adapts to your menstrual cycle,
        energy levels, and recovery needs.
      </p>
    </div>
  </section>

</body>
</html>
