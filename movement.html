<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aro. — Movement</title>

  <style>
    :root {
      --bg-start: #f6efe8;
      --bg-end: #f3f0e9;
      --white: #ffffff;
      --text-main: #3f3f3f;
      --text-muted: #6b6b6b;
      --accent: #c75b7a;
      --soft-pill: #f1e6dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
    }

    /* ---------- HEADER (IDENTICAL TO INDEX) ---------- */

    header {
      width: 100%;
      padding: 28px 48px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }

    .nav-logo {
      height: 128px;
    }

    .nav-center {
      display: flex;
      justify-content: center;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 14px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      opacity: 0.85;
    }

    .nav-cta {
      background: var(--accent);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---------- HERO / EDITORIAL INTRO ---------- */

    .movement-hero {
      padding: 140px 24px 100px;
      text-align: center;
    }

    .pill {
      display: inline-block;
      background: var(--soft-pill);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .movement-hero h1 {
      font-size: 52px;
      margin-bottom: 32px;
    }

    .movement-hero p {
      max-width: 720px;
      margin: 0 auto;
      font-size: 20px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* ---------- CONTENT SECTIONS ---------- */

    section.content {
      background: var(--white);
      padding: 120px 24px;
    }

    .content-inner {
      max-width: 1000px;
      margin: 0 auto;
    }

    .content h2 {
      font-size: 36px;
      margin-bottom: 24px;
    }

    .content p {
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 720px;
      margin-bottom: 24px;
    }

    /* ---------- FEATURE GRID ---------- */

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      margin-top: 64px;
    }

    .feature {
      background: #faf7f4;
      border-radius: 20px;
      padding: 32px 28px;
    }

    .feature h3 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .feature p {
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 768px) {
      header {
        padding: 20px 24px;
        grid-template-columns: auto auto;
      }

      .nav-center {
        display: none;
      }

      .nav-logo {
        height: 96px;
      }

      .movement-hero h1 {
        font-size: 40px;
      }

      .feature-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <img src="aroswirl.svg" alt="Aro swirl
