  <style>
    :root {
      --bg-start: #f6efe8;
      --bg-end: #f3f0e9;
      --text-main: #3f3f3f;
      --text-muted: #6b6b6b;
      --pill-bg: #f1dde4;
      --accent: #c75b7a;
      --rhythm-accent: #c75b7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--text-main);
      background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
    }

    h1, h2, h3 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
    }
